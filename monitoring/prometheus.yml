global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrapes every API replica directly: Docker DNS returns one A record per replica of the `api` service.
  - job_name: llm-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 10s
