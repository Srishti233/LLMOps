# Round-robin load balancer in front of the API replicas.
# Docker's embedded DNS (127.0.0.11) returns every replica of the `api` service; because the upstream is a
# variable, nginx re-resolves it every few seconds, so `docker compose up --scale api=N` needs no reload.
worker_processes 1;
events { worker_connections 256; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 80;

    location / {
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s;    # CPU generation can be slow
      proxy_connect_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
